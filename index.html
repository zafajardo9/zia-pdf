<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icons/logo.png" />
    <meta name="theme-color" content="%%BRAND_THEME_COLOR%%" />
    <link rel="apple-touch-icon" href="./icons/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>%%BRAND_TITLE%%</title>
    <meta name="description" content="%%BRAND_DESCRIPTION%%" />
    <meta name="keywords" content="pdf tools, private pdf, offline pdf merge, split pdf locally, compress pdf browser, electronic signature, pdf to image, no upload pdf" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%%BRAND_SITE_URL%%" />
    <meta property="og:title" content="%%BRAND_TITLE%%" />
    <meta property="og:description" content="%%BRAND_DESCRIPTION%%" />
    <meta property="og:image" content="%%BRAND_SITE_URL%%icons/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="%%BRAND_SITE_URL%%" />
    <meta property="twitter:title" content="%%BRAND_TITLE%%" />
    <meta property="twitter:description" content="%%BRAND_DESCRIPTION%%" />
    <meta property="twitter:image" content="%%BRAND_SITE_URL%%icons/logo.png" />

    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
